<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>EdgeIQ AI — Quantitative Trading Research Lab</title>
  
  <!-- Fonts (Lao, Thai, Inter, JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#0B0F17",
            "surface-container-low": "#111726",
            "surface-container": "#161F33",
            "surface-container-high": "#1E2942",
            "on-surface": "#F8FAFC",
            "on-surface-variant": "#94A3B8",
            "primary": "#06B6D4",
            "secondary": "#10B981",
            "tertiary": "#8B5CF6",
            "error": "#F43F5E"
          }
        }
      }
    };
  </script>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-surface text-on-surface flex flex-col min-h-screen">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl border-b border-surface-container-high/60">
    <div class="h-14 px-4 max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[22px]">insights</span>
        <span class="font-bold text-sm tracking-tight">EdgeIQ AI</span>
        <span class="text-[10px] text-secondary font-mono px-1.5 py-0.5 bg-secondary/10 rounded">LIVE SUPABASE</span>
      </div>
      <div class="text-xs font-mono text-on-surface-variant">BT-001 (Prop Alpha)</div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 w-full max-w-5xl mx-auto pt-16 pb-24 px-4">

    <!-- 1. DASHBOARD VIEW -->
    <section id="view-dashboard" class="space-y-4 pt-2">
      <!-- Target Hero -->
      <div class="p-4 rounded-xl bg-surface-container-low border border-surface-container-high/60 flex justify-between items-center">
        <div>
          <div class="text-[10px] font-mono text-on-surface-variant uppercase">ຄາດຫວັງສຸທິ / Expected Value (EV)</div>
          <div id="stat-expectancy" class="text-3xl font-bold font-mono text-secondary">+0.96R</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] font-mono text-on-surface-variant uppercase">ກຳໄລລວມ / Cumulative R</div>
          <div id="stat-total-r" class="text-xl font-bold font-mono text-primary">+142.6R</div>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="p-3 rounded-xl bg-surface-container-low border border-surface-container-high/60">
          <span class="text-[10px] font-mono text-on-surface-variant uppercase">ໄມ້ເທຣດທັງໝົດ / Total</span>
          <div id="stat-total-trades" class="text-xl font-bold font-mono mt-1">0</div>
        </div>
        <div class="p-3 rounded-xl bg-surface-container-low border border-surface-container-high/60">
          <span class="text-[10px] font-mono text-on-surface-variant uppercase">ອັດຕາວິນ / Win Rate</span>
          <div id="stat-win-rate" class="text-xl font-bold font-mono text-secondary mt-1">0%</div>
        </div>
      </div>
    </section>

    <!-- 2. JOURNAL VIEW -->
    <section id="view-journal" class="hidden space-y-4 pt-2">
      <div class="flex items-center justify-between border-b border-surface-container-high pb-2">
        <h2 class="text-sm font-bold uppercase font-mono">ປະຫວັດການເທຣດ (Supabase Live Feed)</h2>
      </div>
      <div id="trade-list-container" class="space-y-3">
        <!-- Trades ຈະຖືກ render ຈາກ Supabase ອັດຕະໂນມັດຜ່ານ app.js -->
      </div>
    </section>

    <!-- 3. ADD TRADE VIEW -->
    <section id="view-add-trade" class="hidden space-y-4 pt-2">
      <form id="new-trade-form" class="p-4 rounded-xl bg-surface-container-low border border-surface-container-high/60 space-y-3">
        <h3 class="text-sm font-bold font-mono text-primary">ບັນທຶກໄມ້ເທຣດໃໝ່ (New Trade Profile)</h3>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-mono uppercase text-on-surface-variant">Symbol</label>
            <input id="input-symbol" type="text" value="XAUUSD" class="w-full bg-surface-container border border-surface-container-high rounded p-2 text-xs font-mono" required>
          </div>
          <div>
            <label class="text-[10px] font-mono uppercase text-on-surface-variant">Direction</label>
            <select id="input-direction" class="w-full bg-surface-container border border-surface-container-high rounded p-2 text-xs font-mono">
              <option value="LONG">LONG</option>
              <option value="SHORT">SHORT</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-mono uppercase text-on-surface-variant">Timeframe</label>
            <input id="input-tf" type="text" value="15m" class="w-full bg-surface-container border border-surface-container-high rounded p-2 text-xs font-mono" required>
          </div>
          <div>
            <label class="text-[10px] font-mono uppercase text-on-surface-variant">Result (R)</label>
            <input id="input-rr" type="number" step="0.1" value="2.0" class="w-full bg-surface-container border border-surface-container-high rounded p-2 text-xs font-mono" required>
          </div>
        </div>

        <div>
          <label class="text-[10px] font-mono uppercase text-on-surface-variant">User Observation & Reasons</label>
          <textarea id="input-notes" rows="2" placeholder="ເຫດຜົນການເຂົ້າອໍເດີ..." class="w-full bg-surface-container border border-surface-container-high rounded p-2 text-xs"></textarea>
        </div>

        <button type="submit" id="btn-save-analyze" class="w-full py-3 rounded-xl bg-primary text-on-surface font-bold text-xs uppercase font-mono shadow-md">
          Commit Trade & Run AI Engine
        </button>
      </form>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl border-t border-surface-container-high">
    <div class="flex items-center justify-around h-14 max-w-md mx-auto">
      <button onclick="switchView('dashboard')" class="nav-item text-primary font-bold flex flex-col items-center" data-target="dashboard">
        <span class="material-symbols-outlined text-[20px]">grid_view</span>
        <span class="text-[9px] font-mono mt-0.5">Dash</span>
      </button>

      <button onclick="switchView('journal')" class="nav-item text-on-surface-variant flex flex-col items-center" data-target="journal">
        <span class="material-symbols-outlined text-[20px]">menu_book</span>
        <span class="text-[9px] font-mono mt-0.5">Journal</span>
      </button>

      <button onclick="switchView('add-trade')" class="w-10 h-10 -top-2 relative rounded-xl bg-primary text-surface flex items-center justify-center shadow-lg" data-target="add-trade">
        <span class="material-symbols-outlined text-[22px]">add</span>
      </button>
    </div>
  </nav>

  <!-- Scripts -->
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
